name: Publish scheduled content

# Rebuilds Lab Notes and Guides daily. Content with a future "date" field is
# automatically excluded by build-content.js until that date arrives -- so to
# schedule a post for a specific day (e.g. publish every Monday/Wednesday/
# Friday), just set its "date" field to the real target date and drop the
# file into content/lab-notes/ or content/guides/ whenever you want, ahead of
# time. It will sit invisible until this workflow runs on or after that date,
# then go live automatically with no manual action needed that day.
#
# Runs once daily rather than only on M/W/F, since the actual publish DAYS
# come from each file's own date field, not from this schedule -- a daily
# check just means content goes live within a few hours of its target date
# regardless of which day of the week you pick.
#
# NOTE: cron times are UTC and don't auto-adjust for daylight saving time.
# 12:00 UTC is 8am ET during EDT (summer); during EST (winter) this becomes
# 7am ET. Not adjusted automatically -- update the cron value twice a year
# if exact local time matters, or leave it as a roughly-morning publish.
#
# NOTE: GitHub only runs scheduled (cron) workflows from the DEFAULT branch.
# Use "Run workflow" (workflow_dispatch) to test on this branch; the schedule
# starts firing once merged to main.

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publish-content
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Lab Notes and Guides (excludes future-dated content)
        run: node scripts/build-content.js

      - name: Commit if changed
        run: |
          git config user.name "remyslab-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- blog guides sitemap.xml llms.txt; then
            echo "No content changes — nothing to commit."
          else
            git add blog guides sitemap.xml llms.txt
            git commit -m "chore: publish scheduled content [skip ci]"
            git push
          fi
