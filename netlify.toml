[build]
  command = "node scripts/build-content.js && node scripts/build-compare.mjs && node scripts/render-compare.mjs"
  publish = "."

# build-content.js     -> existing blog/guides generation (unchanged)
# build-compare.mjs     -> pulls live prices from all partner Shopify stores
# render-compare.mjs    -> writes index.html (the homepage IS the compare page now)
#
# Compare also refreshes hourly via GitHub Actions (.github/workflows/refresh-compare.yml),
# so this is a safety net, not the only update path. To stop Netlify deploys
# from touching the network at all, drop the build-compare.mjs call:
#   command = "node scripts/build-content.js && node scripts/render-compare.mjs"
