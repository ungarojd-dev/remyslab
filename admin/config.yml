backend:
  name: git-gateway
  branch: main

site_url: "https://remyslab.com"
display_url: "https://remyslab.com"
logo_url: "/assets/icons/logo-dog.png"

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "lab_notes"
    label: "Lab Notes"
    label_singular: "Lab Note"
    folder: "content/lab-notes"
    create: true
    format: "json"
    extension: "json"
    slug: "{{slug}}"
    identifier_field: "title"
    summary: "{{title}} | {{category}} | {{date}}"
    editor:
      preview: false
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "Example: BLACK+DECKER Pet Hair Roller: Remy's Test Notes" }
      - { label: "URL Slug", name: "slug", widget: "string", pattern: ["^[a-z0-9]+(?:-[a-z0-9]+)*$", "Use lowercase letters, numbers, and hyphens only."] }
      - { label: "Publish Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "MM/DD/YYYY", time_format: false }
      - { label: "Published", name: "published", widget: "boolean", default: true, hint: "Turn this off to keep the note out of the live site." }
      - { label: "SEO Description", name: "description", widget: "text", hint: "Keep this around 150 to 160 characters." }
      - { label: "Card Summary", name: "card_summary", widget: "text", hint: "Short summary shown on the Lab Notes board." }
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["Walk Gear", "Toys", "Treats", "Cleaning", "Health", "Accessories"]
      - label: "Sticky Note Color"
        name: "note_color"
        widget: "select"
        default: "green"
        options: ["yellow", "green", "blue", "pink", "orange"]
      - label: "Lab Result"
        name: "lab_result"
        widget: "select"
        default: "approved"
        options:
          - { label: "Remy approved", value: "approved" }
          - { label: "Still testing", value: "testing" }
          - { label: "Not for us", value: "pass" }
      - { label: "Product Name", name: "product_name", widget: "string" }
      - { label: "Brand", name: "brand", widget: "string", required: false }
      - { label: "Product Image", name: "image_url", widget: "image", required: false, hint: "Upload a square product image when available." }
      - { label: "Product Image Alt Text", name: "image_alt", widget: "string", required: false, hint: "Describe the product image clearly for accessibility." }
      - { label: "Price Text", name: "price_text", widget: "string", required: false, hint: "Example: ~$20" }
      - { label: "Affiliate URL", name: "affiliate_url", widget: "string", required: false }
      - { label: "Affiliate Network", name: "affiliate_network", widget: "string", required: false, hint: "Example: Amazon Associates" }
      - { label: "Discount Code", name: "discount_code", widget: "string", required: false }
      - { label: "CTA Button Text", name: "button_text", widget: "string", required: false, default: "Visit brand site" }
      - { label: "Intro", name: "lede", widget: "text" }
      - { label: "Verdict Heading", name: "verdict_title", widget: "string" }
      - { label: "Verdict Summary", name: "verdict_text", widget: "text" }
      - label: "Tested Surfaces or Scenarios"
        name: "surfaces"
        widget: "list"
        required: false
        fields:
          - { label: "Emoji", name: "emoji", widget: "string", required: false }
          - { label: "Name", name: "name", widget: "string" }
          - { label: "Note", name: "note", widget: "text" }
      - { label: "What We Tested", name: "what_we_tested", widget: "markdown" }
      - { label: "What Worked", name: "what_worked", widget: "markdown" }
      - { label: "What Did Not Work", name: "what_didnt_work", widget: "markdown" }
      - { label: "Remy's Take", name: "remys_take", widget: "markdown" }
      - { label: "Worth Buying?", name: "worth_buying", widget: "markdown" }
      - label: "Common Questions"
        name: "faqs"
        widget: "list"
        required: false
        fields:
          - { label: "Question", name: "question", widget: "string" }
          - { label: "Answer", name: "answer", widget: "text" }

  - name: "guides"
    label: "Dog Owner Guides"
    label_singular: "Dog Owner Guide"
    folder: "content/guides"
    create: true
    format: "json"
    extension: "json"
    slug: "{{slug}}"
    identifier_field: "title"
    summary: "{{title}} | {{category}} | {{date}}"
    editor:
      preview: false
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "URL Slug", name: "slug", widget: "string", pattern: ["^[a-z0-9]+(?:-[a-z0-9]+)*$", "Use lowercase letters, numbers, and hyphens only."] }
      - { label: "Publish Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "MM/DD/YYYY", time_format: false }
      - { label: "Published", name: "published", widget: "boolean", default: true, hint: "Turn this off to keep the guide out of the live site." }
      - { label: "SEO Description", name: "description", widget: "text", hint: "Keep this around 150 to 160 characters." }
      - { label: "Card Summary", name: "card_summary", widget: "text", hint: "Short summary shown on the Guides page." }
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["Cleaning", "Walk Gear", "Toys", "Treats", "Everyday Dog Life"]
      - { label: "Quick Answer", name: "quick_answer", widget: "text", hint: "Give the answer first in roughly 40 to 60 words." }
      - { label: "Guide Body", name: "body", widget: "markdown" }
      - label: "Related Lab Notes"
        name: "related_lab_notes"
        widget: "relation"
        collection: "lab_notes"
        search_fields: ["title", "product_name"]
        value_field: "{{slug}}"
        display_fields: ["title"]
        multiple: true
        required: false
      - label: "Common Questions"
        name: "faqs"
        widget: "list"
        required: false
        fields:
          - { label: "Question", name: "question", widget: "string" }
          - { label: "Answer", name: "answer", widget: "text" }

  - name: "partners"
    label: "Partner Pages"
    label_singular: "Partner Page"
    folder: "content/partners"
    create: true
    format: "json"
    extension: "json"
    slug: "{{slug}}"
    identifier_field: "brand_name"
    summary: "{{brand_name}} | {{coupon_code}} | {{user_discount}}"
    editor:
      preview: false
    fields:
      - { label: "Page Title", name: "title", widget: "string" }
      - { label: "URL Slug", name: "slug", widget: "string", pattern: ["^[a-z0-9]+(?:-[a-z0-9]+)*$", "Use lowercase letters, numbers, and hyphens only."] }
      - { label: "Publish Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "MM/DD/YYYY", time_format: false }
      - { label: "Published", name: "published", widget: "boolean", default: true }
      - { label: "SEO Description", name: "description", widget: "text" }
      - { label: "Brand Name", name: "brand_name", widget: "string" }
      - { label: "Website URL", name: "website_url", widget: "string" }
      - { label: "Affiliate URL", name: "affiliate_url", widget: "string", required: false }
      - { label: "Coupon Code", name: "coupon_code", widget: "string" }
      - { label: "User Discount", name: "user_discount", widget: "string" }
      - { label: "Internal Commission Note", name: "commission_note", widget: "string", required: false, hint: "Stored for your reference. Not shown publicly." }
      - { label: "Category", name: "category", widget: "string" }
      - { label: "Logo", name: "logo_url", widget: "image", required: false }
      - { label: "Logo Alt Text", name: "logo_alt", widget: "string", required: false }
      - { label: "Short Summary", name: "short_summary", widget: "text" }
      - { label: "Quick Answer", name: "quick_answer", widget: "text" }
      - { label: "What Brand Sells", name: "what_brand_sells", widget: "text" }
      - { label: "What Remy Is Testing", name: "what_remy_testing", widget: "text" }
      - { label: "What We Like", name: "what_we_like", widget: "text" }
      - { label: "Watch Outs", name: "watch_out_for", widget: "text" }
      - { label: "Best Fit", name: "best_fit", widget: "text" }
      - label: "Related Lab Notes"
        name: "related_lab_notes"
        widget: "relation"
        collection: "lab_notes"
        search_fields: ["title", "product_name"]
        value_field: "{{slug}}"
        display_fields: ["title"]
        multiple: true
        required: false
      - label: "Common Questions"
        name: "faqs"
        widget: "list"
        required: false
        fields:
          - { label: "Question", name: "question", widget: "string" }
          - { label: "Answer", name: "answer", widget: "text" }

  - name: "faq_categories"
    label: "Dog Product FAQ"
    label_singular: "FAQ Category"
    folder: "content/faq-categories"
    create: true
    format: "json"
    extension: "json"
    slug: "{{slug}}"
    identifier_field: "title"
    summary: "{{title}} | {{category}}"
    editor:
      preview: false
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "URL Slug", name: "slug", widget: "string", pattern: ["^[a-z0-9]+(?:-[a-z0-9]+)*$", "Use lowercase letters, numbers, and hyphens only."] }
      - { label: "Publish Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "MM/DD/YYYY", time_format: false }
      - { label: "Published", name: "published", widget: "boolean", default: true }
      - { label: "SEO Description", name: "description", widget: "text" }
      - { label: "Category", name: "category", widget: "string" }
      - { label: "Intro", name: "intro", widget: "text" }
      - label: "FAQ Entries"
        name: "entries"
        widget: "list"
        fields:
          - { label: "Question", name: "question", widget: "string" }
          - { label: "Answer", name: "answer", widget: "text" }
          - label: "Related Partner"
            name: "related_partner"
            widget: "relation"
            collection: "partners"
            search_fields: ["brand_name", "coupon_code"]
            value_field: "{{slug}}"
            display_fields: ["brand_name"]
            required: false
          - label: "Related Lab Notes"
            name: "related_lab_notes"
            widget: "relation"
            collection: "lab_notes"
            search_fields: ["title", "product_name"]
            value_field: "{{slug}}"
            display_fields: ["title"]
            multiple: true
            required: false
